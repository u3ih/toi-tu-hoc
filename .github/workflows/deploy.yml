name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      # pnpm 11 needs Node >= 22.13 (it imports node:sqlite), and Node 20 is
      # deprecated on the runners.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      # Cheap and fast, and a formatting or lint regression should not reach
      # production just because the build happens to still succeed.
      - name: Lint and format check
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build static site
        # A project page is served from /<repo>, a user/org page from /.
        # base_path comes back empty for the latter, which is what we want.
        # SITE_URL is the origin only; canonical URLs add base_path themselves.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          # Repository variable (Settings -> Secrets and variables -> Actions ->
          # Variables), not a secret: a container id is public in the page source.
          # Unset on a fork, so a fork ships no tracker at all.
          NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
        run: pnpm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
